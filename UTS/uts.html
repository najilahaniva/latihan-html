<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VolunTix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <!-- Kolom Kiri -->
        <section class="auth-illustration-side">
            <header class="illustration-header">
                <div class="brand-logo">
                    <span class="logo-text">VolunTix</span>
                </div>
            </header>

            <div class="illustration-content">
                <h1>Shape Great Events,<br>Empower Communities</h1>
                <p>Join our network of passionate volunteers. Connect, collaborate, and bring extraordinary experiences to life.</p>
            </div>
           
            <div class="illustration-spacer"></div>
        </section>

        <!-- Kolom Kanan -->
        <section class="auth-form-side">
            <div class="form-wrapper">
                
                <header class="form-header">
                    <div class="mobile-brand-logo">
                        <span class="logo-text">VolunTix</span>
                    </div>
                </header>

                <div class="welcome-text">
                    <h2>Welcome back</h2>
                    <p>Sign in to your account to continue</p>
                </div>

                <!-- Tombol Google -->
                <button type="button" class="sso-btn" aria-label="Sign in with Google">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.2v3.15C3.17 21.31 7.23 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.2C.44 8.12 0 9.87 0 11.7s.44 3.58 1.2 5.12l4.08-2.55z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.69 1.2 6.58l4.08 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Formulir -->
                <form action="#" method="POST" class="login-form">
                    
                    <div class="input-group">
                        <label for="email">Email or Username</label>
                        <div class="input-field-wrapper">
                            <span class="input-icon" aria-hidden="true">✉</span>
                            <input type="text" id="email" name="email" placeholder="Enter your email or username" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-password">Forgot password?</a>
                        </div>
                        <div class="input-field-wrapper">
                            <span class="input-icon" aria-hidden="true">🔒</span>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Sign In</span>
                        <span class="arrow-icon" aria-hidden="true">→</span>
                    </button>

                </form>

                <footer class="form-footer">
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                </footer>

            </div>
        </section>
    </main>

</body>
</html>
