<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS</title>
</head>
<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222342;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #e6e0e0;
            text-align: center;
        }
    </style>
<h1>Lagi coba CSS SUSAH</h1>

<!-- PEMBATAS  -->

<style>
    .card-container{
    width: 320px;
    padding: 20px;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin: 20px auto;
    }
    .card-title {
    font-size: 24px;
    color: #333;
    margin-bottom: 10px;
    }
    .card-description {
    font-size: 16px;
    color: #666;
    line-height: 1.5;
    }
</style>
    <div class="card-container">
    <div class="card-title">INI JUDUL CARD</div>
    <div class="card-description">INI DESCRIPTION CARD</div>


<!-- PEMBATAS  -->

<style>
    .animated {
        background-color: #FFF3B0;
        color: #5C5200;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s ease-in-out;
    }
    /*Efek saat kursor diarahkan (hover)*/
    .animated:hover {
        background-color: #ff9900;
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
</style>
    <button class="animated">Tombol Animasi</button>
</div>  
    <!-- PEMBATAS  -->

<style>
    /*properti gaya yg sering dipake*/
    .content-text {
        font-family: Arial, sans-serif;
        font-size: 18px;
        line-weight: 16px;
        color: #e3dede;
        line-height: 1.6;
        letter-spacing: 0.5px;
        text-align: justify;
    }
</style>
<div class="content-text"> HHHHHHHHHHHHHHHAAAAAAAAAAAAAAIIIIIIIIIIIIIIIIIIIIIIIIIIIIII</div>
</body>
</html>
