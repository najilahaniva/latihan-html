<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tabel</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="0" bgcolor="#E8F3E8">
        <thead>
            <tr>
                <th>Day</th>
                <th>Performer</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Day 1</td>
                <td>Hindia</td>
            </tr>
            <tr>
                <td>Tulus</td>
            </tr>
            <tr>
                <td rowspan="2">Day 2</td>
                <td>Hivi!</td>
            </tr>
            <tr>
                <td>Nadin Amizah</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
